
name: FRACTRA Docker CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  docker-compose-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f track_2b/docker-compose.yml config -q

      - name: Build and start FRACTRA
        run: docker compose -f track_2b/docker-compose.yml up -d --build
        env:
          LLM_NAME: swiss-ai/apertus-v1.5-8b
          LLM_BASE_URL: https://api.publicai.co/v1
          LLM_API_KEY: ""

      - name: Check backend health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          exit 1

      - name: Check frontend response
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Frontend HTTP check failed"
          exit 1

      - name: Print logs on failure
        if: failure()
        run: docker compose -f track_2b/docker-compose.yml logs --no-color || true

      - name: Stop containers
        if: always()
        run: docker compose -f track_2b/docker-compose.yml down --volumes --remove-orphans
