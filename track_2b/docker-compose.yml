
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fractra-backend
    ports:
      - "5000:5000"
    environment:
      LLM_NAME: ${LLM_NAME:-swiss-ai/apertus-v1.5-8b}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.publicai.co/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PUBLICAI_API_KEY: ${PUBLICAI_API_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - fractra-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: fractra-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fractra-data:
